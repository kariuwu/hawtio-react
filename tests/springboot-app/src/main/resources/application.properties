server.port=10001

# Hawtio
management.endpoints.web.exposure.include=hawtio,jolokia
hawtio.authenticationEnabled=true

# Spring Security
spring.security.user.name=hawtio
spring.security.user.password=hawtio

# Spring Boot Actuator
spring.jmx.enabled=true

# Camel
camel.springboot.name=SampleCamel

# Camel plugin Trace tab
camel.trace.enabled = true

quartz.cron = 0/10 * * * * ?
quartz.repeatInterval = 10000
