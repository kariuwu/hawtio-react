quarkus.http.port=8080

# Hawtio
quarkus.hawtio.authenticationEnabled=true

# Embedded security (user: hawtio, password: hawtio, role: admin)
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.hawtio=hawtio
quarkus.security.users.embedded.roles.hawtio=admin

# Camel
camel.context.name = SampleCamel

# Camel plugin Trace tab
camel.trace.enabled = true

quartz.cron = 0/10 * * * * ?
quartz.repeatInterval = 10000
